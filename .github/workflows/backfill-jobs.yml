name: Backfill offer-runway jobs (one-time)

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run backfill-offer-runway
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
